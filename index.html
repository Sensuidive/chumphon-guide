<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chumphon"><title>Chumphon Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Chumphon Guide by Sensui Dive Center: dive site maps, whale shark log, places to eat, stay and see in Chumphon, Thailand.">
<meta name="theme-color" content="#0e2f4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Mitr:wght@300;400;500;600&family=Sarabun:wght@400;500;600;700&display=swap">
<style>body{margin:0}
/* Layout: one phone-width column; sticky navy header, scrolling body, fixed tab bar. Single light look by choice (brand paper + navy). */
:root{
  --navy:#0e2f4a; --navy2:#0a2236; --yel:#f6e04b; --paper:#f7f3e8; --card:#ffffff; --line:#e4dccb; --sand:#e9e2d2;
  --ink:#0e2f4a; --muted:#5b7285; --sea:#1f7fb8; --green:#1f9e68; --orange:#d9572b; --blue:#2f7fd0; --gold:#8a5f00;
  --wa:#137a3f; --lineapp:#06c755;--lineink:#0b2a17; --soft:#e7f2f9; --tip:#26394a; --warn:#fffbe0;
  --f:"Montserrat","Mitr",system-ui,sans-serif; --fth:"Mitr","Montserrat",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
small{font-size:14px}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;-webkit-tap-highlight-color:transparent}
body.th, body.th button, body.th input, body.th select{font-family:var(--fth)}
/* Thai body text in a reading font (plan item 4); headings, buttons and chips keep Mitr */
body.th p, body.th li, body.th .note, body.th .tip, body.th .card span, body.th .price > span, body.th textarea{font-family:"Sarabun",var(--fth);line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;
  padding-block:10px 12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header img{width:30px;height:auto;flex:none}
header .back{flex:none;background:none;border:0;color:var(--yel);font-weight:900;font-size:26px;line-height:1;padding:0 6px 0 0;cursor:pointer}
header .t{flex:1;min-width:0;font-weight:800;font-size:16px;line-height:1.15}
body.th header .t{font-weight:600}
header .t small{display:block;font-weight:600;font-size:14px;color:#bcd0de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{flex:none;display:flex;background:var(--navy2);border:1px solid #3a5a74;border-radius:16px;padding:2px}
.lang button{border:0;background:none;padding:5px 10px;border-radius:13px;color:#9fb6c6;font-weight:800;font-size:14px;cursor:pointer;font-family:var(--f)}
.lang button.on{background:var(--yel);color:var(--navy)}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:14px 96px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
main>*{min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 10px;font-weight:700;font-size:14px;color:#7b8a97;text-decoration:none}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--navy)}
nav.tabs a.on svg{color:var(--sea)}

h1{font-weight:900;font-size:24px;line-height:1.1;margin:0;letter-spacing:-.3px;text-wrap:balance}
h2{font-weight:900;font-size:19px;line-height:1.15;margin:0;text-wrap:balance}
h3{margin:0;font-weight:800;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
body.th h1,body.th h2{font-weight:600;letter-spacing:0}
body.th h3{letter-spacing:0;text-transform:none;font-weight:500;font-size:14px}
p{margin:0;font-size:14px;line-height:1.55;font-weight:500}
body.th p{font-weight:400}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted);font-weight:600;line-height:1.45}
body.th .note{font-weight:400}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fld textarea{font-family:inherit;resize:vertical}
.fixl{display:flex;justify-content:flex-end;align-items:center;min-height:44px;margin-top:2px;font-size:14px;color:var(--muted,#6b7a89);text-decoration:underline;text-align:right}
.chip{font-weight:700;font-size:14px;padding:4px 10px;border-radius:13px;border:1.5px solid var(--navy);color:var(--navy);background:var(--card);white-space:nowrap}
body.th .chip{font-weight:500}
.chip.ow{background:var(--green);border-color:var(--green);color:#fff}
.chip.adv{background:var(--orange);border-color:var(--orange);color:#fff}
.chip.all{background:var(--blue);border-color:var(--blue);color:#fff}
button.chip{cursor:pointer;border-color:var(--line);color:var(--muted)}
button.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.scrollx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding-inline:14px}
.scrollx::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px;font-weight:800;font-size:14px;text-decoration:none;border:0;cursor:pointer;text-align:center}
body.th .btn{font-weight:500}
.btn svg{width:22px;height:22px;flex:none}
.btn small{display:block;font-weight:600;font-size:14px;opacity:.92}
.btn.y{background:var(--yel);color:var(--navy)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ln{background:var(--lineapp);color:var(--lineink)}
.btn.o{border:1.5px solid var(--navy);color:var(--navy);background:var(--card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rw .usedl{display:block;color:#137a3f;font-weight:700}.rw.used{opacity:.75}.rw .mini{flex:none}
.foot2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted,#6b7a89)}.foot2 .fixl{margin:0}
.otag{display:table;margin-top:4px;font-size:14px;font-weight:700;color:#9a3b1f}.otag.on{color:#137a3f}
.scrollx .chip svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px}
.offl{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:40;background:#5a3e00;color:#fff;text-align:center;font-weight:700;font-size:14px;padding:8px 12px}
.inst.ios{margin:0 0 14px}.boattip{margin:8px 0 0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;margin:2px 0 6px}.chk input{width:22px;height:22px;accent-color:var(--navy,#0e2f4a)}
.tot{margin:10px 0;background:var(--soft);border-radius:14px;padding:11px 12px;line-height:1.5}.trust{text-align:center;font-size:14px;font-weight:700;color:var(--navy,#0e2f4a);margin:10px 0 4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sand);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(14,47,74,.15)}

/* home */
.hero{position:relative;border-radius:20px;overflow:hidden;color:#fff;min-height:160px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:16px;background:var(--navy) center/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,47,74,.05) 30%,rgba(10,34,54,.92))}
.hero>*{position:relative;z-index:1}
.hero .k{color:var(--yel);font-weight:700;font-size:14px}
.hero h1{font-size:34px;color:#fff;line-height:1.05}
.hero.s{min-height:150px;padding:14px}
h2.sec{margin:0;font-weight:800;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
body.th h2.sec{letter-spacing:0;text-transform:none;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:340px){.grid2{grid-template-columns:1fr}}
.grid2.one{grid-template-columns:1fr}
.tile.bt{border:0;color:#fff;gap:3px}.tile.bt .ic{background:rgba(255,255,255,.2)}.tile.bt i{font-style:normal;font-size:14px;font-weight:700;line-height:1.25;opacity:.95}.tile.bt b{color:#fff;font-size:16px;font-weight:800;line-height:1.2}.tile.bt span:last-child{color:#fff;font-size:14px}
body.th .tile.bt i{text-transform:none;letter-spacing:0;font-weight:600}
.tile.bt-offer{background:#b8431c}.tile.bt-dive{background:#0f6e6e}.tile.bt-event{background:#5b3fa6}.tile.bt-season{background:#0e2f4a}
html{scroll-padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.hero p{color:#d7e4ed;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:15px;font-weight:600;outline:none}
.fu{background:#fff;border:1.5px solid #e4dccb;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fu b{font-weight:800;font-size:14px;color:var(--navy)}
.fu span{font-size:14px;color:var(--muted)}
.fu img{width:100%;height:120px;object-fit:cover;border-radius:12px;display:block}
.navb{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--navy);color:#fff;font-weight:800;font-size:14px;padding:11px;border-radius:12px;text-decoration:none}
.navb svg{width:16px;height:16px}
.dist{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;font-weight:700;color:var(--sea);text-decoration:none}
.dist svg{width:14px;height:14px;flex:none}
.sc{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #e4dccb;border-radius:14px;padding:9px 10px 9px 12px;text-decoration:none;color:var(--navy);font-weight:700;font-size:14px}
.sc svg{width:16px;height:16px;flex:none;color:var(--sea)}
.sc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc i{font-style:normal;flex:none;background:var(--navy);color:#fff;font-weight:800;font-size:14px;padding:6px 10px;border-radius:999px}
.sc .go{flex:none;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}
.season{background:var(--navy);color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.season b{color:var(--yel);font-weight:800;font-size:14px;display:block}
.season p{color:#d7e4ed;font-size:14px}
.season a{margin-left:auto;flex:none;background:var(--yel);color:var(--navy);font-weight:800;font-size:14px;padding:9px 11px;border-radius:10px;text-decoration:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;text-decoration:none}
.tile .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.tile .ic svg{width:20px;height:20px}
.tile b{font-weight:800;font-size:14px}
.tile .ic.padi,.tile.s .ic.padi{width:auto;align-self:flex-start;background:#0e2f4a;padding:0 7px}
.tile .ic.padi img{height:20px;width:auto;display:block}
.squad{display:flex;gap:12px;align-items:center;background:#0e2f4a;color:#fff;border-radius:16px;padding:10px;text-decoration:none}
.squad img{width:74px;height:92px;object-fit:cover;border-radius:8px;flex:none}
.squad b{display:block;color:var(--yel);font-weight:800;font-size:14px}
.squad p{color:#d7e4ed;font-size:14px;margin:3px 0 6px}
.squad i{font-style:normal;font-weight:800;font-size:14px;background:var(--yel);color:#0e2f4a;padding:6px 10px;border-radius:999px}
.padib{display:flex;align-items:center;gap:12px;background:#0e2f4a;color:#fff;border-radius:16px;padding:12px 14px}
.padib img{height:34px;width:auto;flex:none}
.padib span{font-size:14px;font-weight:700;color:#d7e4ed}
body.th .tile b{font-weight:600}
.tile span{font-weight:600;font-size:14px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile.s{padding:10px;gap:5px}
.tile.s .ic{width:32px;height:32px;border-radius:9px}
.tile.s .ic svg{width:18px;height:18px}
.tile.s b{font-size:14px;line-height:1.2}
.tile.s span{font-size:14px}
.tile.wide{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;background:var(--warn);border:2px solid var(--yel)}
.tile.wide .ic{grid-row:span 2}
.slogan{text-align:center;font-weight:700;font-style:italic;font-size:14px;color:var(--muted)}

/* sites */
.imgbox{display:block;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.imgbox img{display:block;width:100%;height:auto}
.site{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none}
.site .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--yel);color:var(--navy);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.site .n.x{background:var(--sand);color:var(--muted)}
.site .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.site .m b{font-weight:800;font-size:14.5px}
body.th .site .m b{font-weight:600}
.site .m>span{font-size:14px;color:var(--muted);font-weight:600}
.site .go{flex:none;color:var(--sea);font-weight:900;font-size:22px}
.site.best{border:2px solid var(--yel);background:var(--warn)}
.tag{display:inline-block;width:fit-content;font-weight:800;font-size:14px;letter-spacing:1px;background:var(--navy);color:var(--yel);padding:2px 7px;border-radius:8px}
.see{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.see div{display:flex;gap:7px;align-items:flex-start;font-weight:600;font-size:14px;line-height:1.35}
body.th .see div{font-weight:400}
.see div::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--yel);box-shadow:0 0 0 1.5px var(--gold);margin-top:5px}
.ws{background:var(--soft);border-radius:14px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start}
.ws svg{flex:none;width:28px;height:28px;color:var(--sea)}
.ws p{font-size:14px}
.ws p small{display:block;color:var(--muted);font-weight:600;margin-top:3px}
.safety{display:flex;gap:10px;align-items:flex-start;border:1.5px dashed #c9bfa8;border-radius:14px;padding:10px 12px}
.safety svg{flex:none;width:22px;height:22px;color:var(--orange)}
.safety p{font-size:14px}

/* log */
.stat{display:flex;align-items:flex-end;gap:12px;background:var(--navy);color:#fff;border-radius:18px;padding:14px}
.stat .big{font-weight:900;font-size:52px;line-height:.9;color:var(--yel);font-variant-numeric:tabular-nums;font-family:var(--f)}
.stat p{color:#d7e4ed;font-size:14px;font-weight:600}
.bars{height:130px;display:grid;grid-template-columns:repeat(8,1fr);gap:7px;align-items:end;margin-top:12px;border-bottom:1.5px solid var(--line)}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;background:var(--sea);border-radius:6px 6px 0 0;min-height:3px}
.bar.pk i{background:var(--yel);box-shadow:inset 0 0 0 1.5px var(--gold)}
.bar u{text-decoration:none;font-weight:800;font-size:14px;margin-bottom:3px;font-variant-numeric:tabular-nums}
.mons{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:5px}
.mons span{text-align:center;font-weight:700;font-size:14px;color:var(--muted)}
.logrow{display:grid;grid-template-columns:100px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #efe9dc;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.logrow:last-child{border-bottom:0}
.logrow span:last-child{color:var(--muted)}
.rules{display:flex;flex-direction:column;gap:8px}
.rules div{display:flex;gap:9px;font-weight:600;font-size:14px;line-height:1.45}
body.th .rules div{font-weight:400}
.rules i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--yel);font-style:normal;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}

/* listings */
.place{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:7px}
.place .h{display:flex;gap:10px;align-items:flex-start}
.place .ic{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.place .ic svg{width:19px;height:19px}
.place .nm{flex:1;min-width:0}
.place .nm b{display:block;font-weight:800;font-size:14.5px}
body.th .place .nm b{font-weight:600}
.place .nm span{font-weight:600;font-size:14px;color:var(--muted)}
.place .rt{flex:none;text-align:right;font-weight:900;font-size:17px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;font-family:var(--f)}
.place .rt small{display:block;font-weight:600;font-size:14px;color:var(--muted);margin-top:3px}
.place .tip{font-style:italic;font-weight:500;font-size:14px;color:var(--tip)}
body.th .place .tip{font-style:normal;font-weight:300}
.place .pr{font-weight:700;font-size:14px;color:var(--navy)}
.place .hrl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-top:4px}.place .hrl svg{width:16px;height:16px;flex:none}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts a{flex:1 1 auto;min-width:62px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;padding:8px 6px;font-weight:800;font-size:14px;color:#fff;text-decoration:none}
body.th .acts a{font-weight:500}
.acts a.call{background:var(--navy)} .acts a.wa{background:var(--wa)} .acts a.ln{background:var(--lineapp);color:var(--lineink)}
.acts a.map{background:var(--sea)} .acts a.web{background:var(--card);color:var(--navy);border:1.5px solid var(--line)}
.acts a.mail{background:var(--card);color:var(--navy);border:1.5px solid var(--line)}
.grp{margin-top:4px}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-weight:600}

/* book */
.price{display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;border-left:5px solid var(--c,var(--sea))}
.price .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price b{font-weight:800;font-size:14px}
body.th .price b{font-weight:600}
.price .v{font-weight:900;font-size:17px;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--f)}
.price .v small{font-size:14px;color:var(--muted);font-weight:700}
.price span{font-weight:600;font-size:14px;color:var(--muted);line-height:1.45}
body.th .price span{font-weight:400}
.form{display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-weight:700;font-size:14px;color:var(--muted)}

  all.forEach(o => { const t = tripOf(o[0]), sp = (t.legs || [t]).find(l => l.frm !== 'Chumphon' && l.to !== 'Chumphon') || {};
    o[1] = t.legs ? t.dep + ' → ' + t.arr + (sp.pier ? ' · ' + sp.pier + ' ' + U('kPier') : '') + ' (' + U('pTao') + ' ' + t.legs[0].arr + '-' + t.legs[1].dep + ')' : t.dep + ' → ' + t.arr + (sp.pier ? ' · ' + sp.pier + ' ' + U('kPier') : ''); });
