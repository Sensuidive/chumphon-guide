name: TMD data
on:
  schedule: [{cron: '7 * * * *'}]
  push: {paths: ['tools/**', '.github/workflows/**']}
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tmd_warnings.py
        env:
          TMD_UID: ${{ secrets.TMD_UID }}
          TMD_UKEY: ${{ secrets.TMD_UKEY }}
      - run: if [ $(( $(date -u +%H) % 3 )) -eq 0 ] || [ "${{ github.event_name }}" != "schedule" ]; then python3 tools/tmd_forecast.py; fi
        env:
          TMD_TOKEN: ${{ secrets.TMD_TOKEN }}
      - run: |
          git config user.name "Sensuidive"; git config user.email "sensuidive@users.noreply.github.com"
          git add -A warnings.json wx_tmd.json 2>/dev/null; git diff --cached --quiet || (git commit -m "TMD data update" && git pull --rebase -q && git push)
