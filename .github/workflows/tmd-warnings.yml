name: TMD warnings
on:
  schedule: [{cron: '7 * * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tmd_warnings.py
        env:
          TMD_UID: ${{ secrets.TMD_UID }}
          TMD_UKEY: ${{ secrets.TMD_UKEY }}
      - run: |
          git config user.name "Sensuidive"; git config user.email "sensuidive@users.noreply.github.com"
          git add warnings.json && git diff --cached --quiet || (git commit -m "TMD warnings update" && git push)
